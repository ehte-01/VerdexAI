server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-damp-wildflower-a1p5bcsx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: ignored
      password: ignored

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
    model: openai/gpt-oss-120b
    max-tokens: 4000

verdex:
  cors:
    allowed-origins: "https://verdexai.pages.dev,http://localhost:3000"

encryption:
  key: ${ENCRYPTION_KEY}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

application:
  base-url: ${BASE_URL:https://verdexai.onrender.com}