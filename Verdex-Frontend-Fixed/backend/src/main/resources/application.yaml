server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    user:
      name: ignored
      password: ignored

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
    model: openai/gpt-oss-120b
    max-tokens: 4000

verdex:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://verdexai.pages.dev,http://localhost:3000}

encryption:
  key: ${ENCRYPTION_KEY}

file:
  upload-dir: ${UPLOAD_DIR:uploads}

application:
  base-url: ${BASE_URL:https://verdexai.onrender.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
